name: Presentation submission

# Turns an "Add a presentation" issue into a pull request against
# data/presentations.csv. Nothing is published until a maintainer merges it.
on:
  issues:
    types: [opened, edited, labeled]
  # Escape hatch: process an issue that was opened before this workflow worked,
  # or re-run one without editing it.
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to process
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: presentation-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true

jobs:
  to-pull-request:
    # Recognise a submission by its body, not by its label or title: issue forms
    # drop `labels:` entries for labels that do not already exist in the repo,
    # and the title is only a prefill that submitters routinely replace.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.issue.labels.*.name, 'presentation-submission') ||
      (contains(github.event.issue.body, '### Year') &&
       contains(github.event.issue.body, '### Speakers'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || inputs.issue }}
        run: |
          set -euo pipefail
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"
          # Written to a file rather than an output or env var: the body is
          # untrusted input from a public form and must never be interpolated
          # into a shell command.
          gh issue view "$NUMBER" --json body  --jq .body         > issue_body.txt
          gh issue view "$NUMBER" --json author --jq .author.login > issue_author.txt
          echo "author=$(cat issue_author.txt)" >> "$GITHUB_OUTPUT"

      - name: Label the issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          # Create the label on first use; issue forms cannot create it themselves.
          gh label create presentation-submission \
            --color 0E8A16 \
            --description "Submitted through the Add a presentation form" \
            2>/dev/null || true
          gh issue edit "$NUMBER" --add-label presentation-submission

      - name: Parse the submission into a CSV row
        id: parse
        env:
          ISSUE_BODY_FILE: issue_body.txt
          ERROR_FILE: parse_error.md
        run: python3 .github/scripts/add_presentation.py

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_AUTHOR: ${{ steps.issue.outputs.author }}
          ROW_TITLE: ${{ steps.parse.outputs.title }}
          ROW_SUMMARY: ${{ steps.parse.outputs.summary }}
        run: |
          set -euo pipefail
          BRANCH="presentation/issue-${ISSUE_NUMBER}"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/presentations.csv

          if git diff --cached --quiet; then
            echo "Nothing to commit; presentations.csv already matches."
            exit 0
          fi

          git commit -m "Add presentation from issue #${ISSUE_NUMBER}"
          git push --force origin "$BRANCH"

          BODY=$(printf 'Adds a row to `data/presentations.csv`.\n\n%s\n\nSubmitted by @%s in #%s.\n\nMerging this republishes the site automatically.' \
            "$ROW_SUMMARY" "$ISSUE_AUTHOR" "$ISSUE_NUMBER")

          # Opening the pull request needs "Allow GitHub Actions to create and
          # approve pull requests" (Settings -> Actions -> General). If that is
          # off, the branch is still pushed, so fall back to handing a maintainer
          # the compare link rather than failing the run.
          if gh pr view "$BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$BRANCH" --body "$BODY"
            OPENED=yes
          elif gh pr create --base main --head "$BRANCH" \
                 --title "Add presentation: ${ROW_TITLE}" --body "$BODY"; then
            OPENED=yes
          else
            OPENED=no
          fi

          if [ "$OPENED" = yes ]; then
            URL=$(gh pr view "$BRANCH" --json url --jq .url)
            gh issue comment "$ISSUE_NUMBER" --body \
              "Thanks! I opened ${URL} with this entry. A maintainer will review it, and the site republishes once it is merged."
          else
            COMPARE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            printf 'Thanks! I prepared this entry on branch `%s`.\n\n%s\n\nThis repository does not allow GitHub Actions to open pull requests, so a maintainer needs to open it here: %s\n' \
              "$BRANCH" "$ROW_SUMMARY" "$COMPARE" > pr_fallback.md
            gh issue comment "$ISSUE_NUMBER" --body-file pr_fallback.md
          fi

      - name: Report a problem back to the submitter
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Only a parse failure is the submitter's to fix; anything else is a
          # repository problem and saying "edit the issue" would be misleading.
          if [ -f parse_error.md ]; then
            printf 'I could not add this entry.\n\n%s\n\nEdit the issue and I will try again automatically.\n' \
              "$(cat parse_error.md)" > comment.md
          else
            printf 'Your submission parsed correctly, but the workflow failed afterwards, so this is not something you need to fix. A maintainer should check the [run log](%s).\n' \
              "$RUN_URL" > comment.md
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file comment.md
